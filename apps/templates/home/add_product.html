{% extends "layouts/base.html" %}
{% block title %} Add Product {% endblock %}
{% block stylesheets %}{% endblock stylesheets %}

{% block content %}
<div class="body flex-grow-1 px-3">
  <div class="container-lg">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-0">➕ Add Product</h2>
        <small class="text-muted">Add a new product to your catalog</small>
      </div>
      <a href="/products" class="btn btn-secondary">← Back to Products</a>
    </div>

    <div class="card">
      <div class="card-body p-4">
        <form method="post" action="/products/add">

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Product Name *</label>
              <input type="text" name="name" class="form-control" placeholder="e.g. LED Bulb 20W" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Category</label>
              <select name="category" class="form-select">
                <option value="">-- Select Category --</option>
                <option value="Lights">Lights</option>
                <option value="Fans">Fans</option>
                <option value="Wiring">Wiring</option>
                <option value="Switches">Switches</option>
                <option value="Sockets">Sockets</option>
                <option value="Batteries">Batteries</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label fw-semibold">Price (Rs.) *</label>
              <input type="number" name="price" class="form-control" placeholder="0.00" step="0.01" min="0" required>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label fw-semibold">Stock Quantity</label>
              <input type="number" name="stock_qty" class="form-control" placeholder="0" min="0" value="0">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label fw-semibold">Low Stock Alert At</label>
              <input type="number" name="low_stock_threshold" class="form-control" placeholder="10" min="0" value="10">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Optional product description..."></textarea>
          </div>

          <div class="d-flex gap-2 mt-2">
            <button type="submit" class="btn btn-primary fw-semibold px-4">Save Product</button>
            <a href="/products" class="btn btn-secondary px-4">Cancel</a>
          </div>

        </form>
      </div>
    </div>

  </div>
</div>
{% endblock content %}
{% block javascripts %}{% endblock javascripts %}
