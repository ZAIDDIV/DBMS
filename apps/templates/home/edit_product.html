{% extends "layouts/base.html" %}
{% block title %} Edit Product {% endblock %}
{% block stylesheets %}{% endblock stylesheets %}

{% block content %}
<div class="body flex-grow-1 px-3">
  <div class="container-lg">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-0">✏️ Edit Product</h2>
        <small class="text-muted">Update product details</small>
      </div>
      <a href="/products" class="btn btn-secondary">← Back to Products</a>
    </div>

    <div class="card">
      <div class="card-body p-4">
        <form method="post" action="/products/edit/{{ product.id }}">

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Product Name *</label>
              <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Category</label>
              <select name="category" class="form-select">
                <option value="">-- Select Category --</option>
                {% for cat in ['Lights','Fans','Wiring','Switches','Sockets','Batteries','Other'] %}
                <option value="{{ cat }}" {% if product.category == cat %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
              </select>
            </div>
          </div>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label fw-semibold">Price (Rs.) *</label>
              <input type="number" name="price" class="form-control" value="{{ product.price }}" step="0.01" min="0" required>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label fw-semibold">Stock Quantity</label>
              <input type="number" name="stock_qty" class="form-control" value="{{ product.stock_qty }}" min="0">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label fw-semibold">Low Stock Alert At</label>
              <input type="number" name="low_stock_threshold" class="form-control" value="{{ product.low_stock_threshold }}" min="0">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea name="description" class="form-control" rows="3">{{ product.description or '' }}</textarea>
          </div>

          <div class="d-flex gap-2 mt-2">
            <button type="submit" class="btn btn-warning fw-semibold px-4">Update Product</button>
            <a href="/products" class="btn btn-secondary px-4">Cancel</a>
          </div>

        </form>
      </div>
    </div>

  </div>
</div>
{% endblock content %}
{% block javascripts %}{% endblock javascripts %}
